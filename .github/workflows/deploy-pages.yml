name: Publish v2 to GitHub Pages

on:
  push:
    branches: [front-v2]
  workflow_dispatch:

concurrency:
  group: twinpeaks-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/front-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gh-pages/browser
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-branch
      - name: Push static build to gh-pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude=.git dist/gh-pages/browser/ pages-branch/
          cd pages-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Deploy v2 from ${SOURCE_SHA}"
            git push origin HEAD:gh-pages
          fi

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GITHUB_TOKEN branch pushes do not trigger the legacy Pages builder.
      - name: Deploy uploaded Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
