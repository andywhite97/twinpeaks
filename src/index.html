<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('twinpeaks-theme');
        theme = saved === 'light' || saved === 'dark' ? saved
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (_) {
        try { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (_) {}
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <style>html{background:#F6F9FD;color-scheme:light}html[data-theme=dark]{background:#071525;color-scheme:dark}</style>
  <title>TwinPeaks Investment | Technology, Security & Digital Solutions</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Technology, security and digital solutions for businesses and communities in Eswatini. Built on Vision, Driven by Progress.">
  <meta name="theme-color" content="#0B3D91">
  <link rel="icon" type="image/png" href="/assets/brand/icon_only.png">
  <link rel="preload" href="/assets/fonts/Poppins-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body><app-root></app-root></body>
</html>
