<section class="text-center overflow-hidden py-0" data-zanim-timeline="{}">
  <div class="bg-holder overlay parallax" [style.background-image]="'url(' + backgroundImage + ')'"></div>
  <div class="container-fluid">
    <div class="header-overlay" style="background-color: rgba(0, 0, 0, 0);"></div>
    <div class="page-header__content position-relative pt-10 pb-8">
      <div class="header-text">
        <div class="overflow-hidden">
          <h1 class="page-header__title display-4 fs-7 text-white fw-lighter ls-2"
            data-zanim-xs="{&quot;duration&quot;:2,&quot;delay&quot;:0}"
            style="transform: translate(0px, 0px); opacity: 1;">{{ title }}</h1>
        </div>
        <div class="overflow-hidden">
          <div class="d-flex justify-content-center" data-zanim-xs="{&quot;duration&quot;:2,&quot;delay&quot;:0.1}"
            style="transform: translate(0px, 0px); opacity: 1;">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb text-uppercase ls-2">
                <li class="breadcrumb-item"><a class="text-400 hover-color-white" routerLink="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ breadcrumb || title }}</li>
              </ol>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
