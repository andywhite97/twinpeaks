<nav class="navbar navbar-expand-lg navbar-dark navbar-theme site-navigation fixed-top p-0"
  aria-label="Primary navigation">
  <div class="container">
    <a class="navbar-brand fw-normal ls-2" routerLink="/" (click)="closeMenu()">Twinpeaks</a>
    <div class="navbar-collapse" id="primaryNavbarCollapse" [class.is-open]="isMenuOpen">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" id="hometab" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenuAndNavigate()"><span class="nav-link-text">Home</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="productstab" routerLink="/products" routerLinkActive="active" (click)="closeMenuAndNavigate()"><span
              class="nav-link-text">Products</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="servicetab" routerLink="/services" routerLinkActive="active" (click)="closeMenuAndNavigate()"><span
              class="nav-link-text">Services</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="projectstab" routerLink="/projects" routerLinkActive="active" (click)="closeMenuAndNavigate()"><span
              class="nav-link-text">Projects</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="abouttab" routerLink="/about" routerLinkActive="active" (click)="closeMenuAndNavigate()"><span
              class="nav-link-text">About</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="contacttab" routerLink="/contact" routerLinkActive="active" (click)="closeMenuAndNavigate()"><span
              class="nav-link-text">Contact</span></a>
        </li>
        <li class="nav-item ms-lg-3 d-flex align-items-center justify-content-center"><a class="btn btn-sm btn-light" routerLink="/contact" (click)="closeMenuAndNavigate()">Request a quote</a></li>
      </ul>
    </div>
    <div class="navbar-actions">
      <a class="navbar-cart" routerLink="/cart" role="status" aria-live="polite" [attr.aria-label]="cartService.itemCount() + (cartService.itemCount() === 1 ? ' item in cart' : ' items in cart')">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M3 3h2l2.1 11.1a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.5L20 7H6.3M9.5 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" /></svg>
        @if (cartService.itemCount() > 0) { <span class="bg-primary navbar-cart__count">{{ cartService.itemCount() }}</span> }
      </a>
      <button class="navbar-toggler p-0" type="button" (click)="toggleMenu()"
        aria-controls="primaryNavbarCollapse" [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    </div>
  </div>
</nav>
