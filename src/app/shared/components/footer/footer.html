<section class="bg-1100 py-6 pb-9 px-3 px-lg-0">
  <div class="container">
    <div class="row">
      <div class="col-lg-4 pe-lg-4 mb-4 mb-lg-0">
        <h5 class="text-white mb-3">Our Mission</h5>
        <p class="text-700">{{ mission() }}</p>
        @if (socialLinks().length) {
          <ul class="list-inline mb-0">
            @for (social of socialLinks(); track social.label) {
              <li class="list-inline-item me-0">
                <a class="text-900 hover-color-white {{ social.spacingClass }}" [href]="social.url"
                  target="_blank" rel="noopener noreferrer" [attr.aria-label]="social.label">
                  <span [class]="social.iconClass"></span>
                </a>
              </li>
            }
          </ul>
        }
      </div>
      <div class="col-lg-8">
        <div class="row">
          <div class="col-6 col-md-3 ps-lg-4 mb-4 mb-lg-0">
            <h5 class="text-white mb-3">Company</h5>
            <ul class="list-unstyled mb-0">
              <li class="mb-1"><a class="text-700 hover-color-white" routerLink="/about">About</a></li>
              <li class="mb-1"><a class="text-700 hover-color-white" routerLink="/contact">Contact</a></li>
            </ul>
          </div>
          <div class="col-6 col-md-3 ps-4 mb-4 mb-lg-0">
            <h5 class="text-white mb-3">Product</h5>
            <ul class="list-unstyled mb-0">
              <li class="mb-1"><a class="text-700 hover-color-white" routerLink="/gallery">Projects</a></li>
              <li class="mb-1"><a class="text-700 hover-color-white" routerLink="/services">Services</a></li>
              <li class="mb-1"><a class="text-700 hover-color-white" routerLink="/products">Products</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div><!-- end of .container-->
</section>

<footer class="footer text-center bg-black py-3 position-absolute w-100 bottom-0">
  <div class="container">
    <div class="row justify-content-between">
      <div class="col-12 col-md-auto mb-1 mb-md-0">
        <p class="mb-0">Designed & Built by Twinpeaks © {{ currentYear }} All rights reserved.</p>
      </div>
    </div>
  </div>
</footer>

<a class="btn-back-to-top" href="#top" style="opacity: 1;"><img src="./img/icons/upload-arrow.svg"
    width="8" alt=""></a>
