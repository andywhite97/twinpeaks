@if (isLoading()) {
  <div class="container py-5">
    <div class="placeholder-glow">
      <div class="placeholder col-12 mb-3" style="height: 420px;"></div>
      <div class="placeholder col-6 mb-3" style="height: 40px;"></div>
      <div class="placeholder col-12 mb-2" style="height: 20px;"></div>
      <div class="placeholder col-10" style="height: 20px;"></div>
    </div>
  </div>
} @else {
  <app-hero-section [hero]="homepageData()?.hero || null"></app-hero-section>
  <app-solutions-section [solutions]="homepageData()?.solutions || []"></app-solutions-section>
  <app-featured-categories-section [categories]="homepageData()?.featured_categories || []"></app-featured-categories-section>
  <app-featured-products-section [products]="homepageData()?.featured_products || []"></app-featured-products-section>
  <app-statistics-section [statistics]="homepageData()?.statistics || []"></app-statistics-section>
  <app-projects-section [projects]="homepageData()?.projects || []"></app-projects-section>
  <app-brands-section [brands]="homepageData()?.brands || []"></app-brands-section>
  <app-testimonials-section [testimonials]="homepageData()?.testimonials || []"></app-testimonials-section>
  <app-cta-section [settings]="homepageData()?.settings || null"></app-cta-section>
}
