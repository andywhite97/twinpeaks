<section class="py-5 py-lg-6 bg-white">
  <div class="container">
    <div class="row mb-5">
      <div class="col-lg-8">
        <p class="text-uppercase small fw-semibold mb-2 text-primary">Recent projects</p>
        <h2 class="display-6 fw-semibold mb-3">A portfolio of meaningful work</h2>
      </div>
    </div>
    <div class="row g-4">
      @for (project of projects; track project.id) {
        <div class="col-md-6 col-lg-4">
          <article class="card h-100 border-0 shadow-sm project-card rounded-4 overflow-hidden">
            <img [src]="project.image || 'https://placehold.co/600x400?text=Project'" [alt]="project.title" class="card-img-top" style="height: 220px; object-fit: cover;">
            <div class="card-body p-4 p-lg-5">
              <p class="text-muted small mb-2">{{ project.category || 'Project' }}</p>
              <h3 class="h5 mb-2">{{ project.title }}</h3>
              <p class="text-muted small mb-3">{{ project.short_description }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="small text-muted">{{ project.location }}</span>
                <a class="btn btn-outline-dark btn-sm" [routerLink]="project.link_url || '/gallery'">View project</a>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
