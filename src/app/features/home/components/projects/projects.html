@if (projects.length) {
  <section class="text-center py-5" id="portfolio">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 mb-4">
          <h2 class="fs-md-5 mb-2">Recent projects</h2>
          <p class="fs--1 text-uppercase text-black ls-1 mb-0">A portfolio of meaningful work</p>
          <hr class="hr-short bg-black opacity-100" />
        </div>
      </div>

      <div class="row g-4 mt-1 text-start">
        @for (project of projects; track project.id) {
          <div class="col-sm-6 col-lg-4">
            <a
              class="project-card d-block h-100 rounded overflow-hidden text-decoration-none"
              [routerLink]="['/projects', project.slug]">
              <img
                class="project-image img-fluid w-100"
                [src]="(project.image || 'https://placehold.co/600x400?text=Project') | optimizedImage: 800"
                [attr.srcset]="project.image ? ((project.image | optimizedImage: 480) + ' 480w, ' + (project.image | optimizedImage: 800) + ' 800w') : null"
                sizes="(min-width: 992px) 360px, (min-width: 576px) 50vw, 100vw"
                width="800" height="533" loading="lazy" decoding="async"
                [alt]="project.title"
                (error)="useFallbackImage($event)" />
              <div class="project-card__content p-4">
                @if (project.category) {
                  <p class="small text-uppercase ls-1 text-600 mb-2">{{ project.category }}</p>
                }
                <h3 class="h4 text-dark mb-2">{{ project.title }}</h3>
                <p class="mb-0 text-700">{{ project.short_description }}</p>
              </div>
            </a>
          </div>
        }
      </div>
    </div>
  </section>
}
