@if (categories.length) {
  <section class="py-6 bg-200" aria-labelledby="featured-categories-heading">
    <div class="container">
      <div class="text-center mb-5"><h2 id="featured-categories-heading" class="fs-md-5 mb-2">Shop By Category</h2><p class="fs--1 text-uppercase text-black ls-1 mb-0">Find the right product category for your business</p><hr class="hr-short bg-black" /></div>
      <div class="row g-4">
        @for (category of categories; track category.id) {
          <div class="col-sm-6 col-lg-4">
            <a class="category-card d-block h-100 rounded overflow-hidden text-decoration-none" [routerLink]="['/products']" [queryParams]="{ category: category.slug }">
              <img class="category-card__image img-fluid w-100" [src]="category.image || fallbackImage(category.name)" [alt]="category.name" width="800" height="533" loading="lazy" decoding="async" (error)="useFallbackImage($event, category.name)" />
              <div class="p-4"><h3 class="h4 text-dark mb-2">{{ category.name }}</h3><p class="text-700 mb-0">{{ category.description || 'Explore products in this category.' }}</p></div>
            </a>
          </div>
        }
      </div>
    </div>
  </section>
}
