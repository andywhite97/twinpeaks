<section class="py-5 py-lg-6 bg-dark text-white">
  <div class="container">
    <div class="row g-4">
      @for (stat of statistics; track stat.id) {
        <div class="col-md-6 col-lg-3">
          <div class="text-center p-4 p-lg-5 rounded-4 border border-white-10 shadow-sm">
            <h3 class="display-6 fw-semibold mb-2">{{ stat.prefix || '' }}{{ stat.value }}{{ stat.suffix || '' }}</h3>
            <p class="text-white-50 mb-0">{{ stat.label }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
