<app-page-header title="Projects" backgroundImage="./img/headers/gallery.jpg"></app-page-header>
<section class="py-5"><div class="container"><div class="row g-4">@if (isLoading) { <div class="col"><app-loader message="Loading projects..."></app-loader></div> } @else if (hasError) { <div class="col text-center"><p class="text-700">Projects could not be loaded right now.</p></div> } @else { @for (project of projects; track project.id) { <div class="col-md-6 col-lg-4"><a class="project-card d-block h-100 rounded overflow-hidden text-decoration-none" [routerLink]="['/projects', project.slug]"><img class="project-card__image img-fluid w-100" [src]="project.image | optimizedImage: 800" [attr.srcset]="(project.image | optimizedImage: 480) + ' 480w, ' + (project.image | optimizedImage: 800) + ' 800w'" sizes="(min-width: 992px) 360px, (min-width: 768px) 50vw, 100vw" width="800" height="533" [alt]="project.title" loading="lazy" decoding="async" /><div class="p-4"><p class="small text-uppercase text-600 ls-1 mb-2">{{ project.category || 'Project' }}</p><h2 class="h4 text-dark">{{ project.title }}</h2><p class="text-700 mb-0">{{ project.short_description }}</p></div></a></div> } @empty { <div class="col text-center"><p class="text-700">No projects have been added yet.</p></div> } }</div></div></section>
