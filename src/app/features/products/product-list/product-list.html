<app-page-header title="Products" backgroundImage="./img/headers/products.jpg"></app-page-header>

<section id="product-list" class="py-5">
  <div class="container">
    <div class="row">
      @if (isLoading) {
        <div class="col"><app-loader message="Loading products..."></app-loader></div>
      } @else if (hasError) {
        <div class="col text-center"><p class="text-700 mb-0">Products could not be loaded right now.</p></div>
      } @else {
        @for (product of products; track product.id) {
          <div class="col-md-6 col-lg-4 mb-4"><app-product-card [product]="product" /></div>
        } @empty {
          <div class="col text-center"><p class="text-700 mb-0">No products have been added yet.</p></div>
        }
      }
    </div>
    @if (isLoadingMore) {
      <div class="product-loader" aria-live="polite"><span class="product-loader-spinner"></span><span>Loading more products...</span></div>
    }
    @if (hasMoreProducts && !isLoadingMore) {
      <div class="text-center"><button class="btn btn-sm btn-outline-dark hvr-sweep-top mt-5" type="button" (click)="loadMoreProducts()">Load more products</button></div>
    }
  </div>
</section>
